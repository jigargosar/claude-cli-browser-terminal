<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code</title>
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./reader.css">
</head>
<body>
<main id="terminal-pane"><div id="term"></div></main>
<div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"></div>
<aside id="reply-pane" aria-label="Last reply">
  <!-- One gear over the reply text: status and reading settings. These change rarely. -->
  <button type="button" id="settings-button" class="bar-button" popovertarget="settings" aria-label="Settings">&#9881;</button>
  <div id="settings" class="panel" popover aria-label="Settings">
    <p id="reply-status" class="label">Waiting for the first reply</p>
    <!-- Reading settings: reader.js wires the [data-set] buttons and the size buttons. -->
    <div class="row"><span class="label">Text size</span>
      <div class="seg" role="group" aria-label="Text size">
        <button type="button" id="size-down" aria-label="Smaller text">A−</button>
        <output id="size-value"></output>
        <button type="button" id="size-up" aria-label="Larger text">A+</button>
      </div>
    </div>
    <div class="row"><span class="label">Line spacing</span>
      <div class="seg" role="group" aria-label="Line spacing">
        <button type="button" data-set="leading" data-value="tight">Tight</button>
        <button type="button" data-set="leading" data-value="normal">Normal</button>
        <button type="button" data-set="leading" data-value="loose">Loose</button>
      </div>
    </div>
    <div class="row"><span class="label">Width</span>
      <div class="seg" role="group" aria-label="Width">
        <button type="button" data-set="width" data-value="narrow">Narrow</button>
        <button type="button" data-set="width" data-value="normal">Normal</button>
        <button type="button" data-set="width" data-value="wide">Wide</button>
      </div>
    </div>
    <button type="button" id="reader-reset" class="bar-button">Reset reading settings</button>
  </div>
  <article id="reply" class="md" tabindex="0"><p class="empty">Replies from this session show up here.</p></article>
  <!-- Comments on reply text (views/comments.js). Floating UI places the button and the box at the selection.
       Inside the pane, so they take the reading colors. -->
  <button type="button" id="comment-submit" class="bar-button" hidden></button>
  <button type="button" id="comment-reply" class="bar-button comment-float" hidden>Reply</button>
  <div id="comment-box" class="comment-float" hidden>
    <textarea aria-label="Comment"></textarea>
    <p>Enter saves · Ctrl+Enter sends all · Shift+Enter new line · Esc cancels · empty deletes</p>
  </div>
</aside>
<script type="module" src="./main.js"></script>
</body>
</html>
