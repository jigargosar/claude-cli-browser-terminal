<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reply pane mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --sepia-bg: #f4ecd8;
      --sepia-text: #5b4636;
      --sepia-head: #3e2f23;
      --sepia-line: #d8c9a8;
      --sepia-code: #ebe1c8;
    }
  </style>
</head>
<body class="h-screen m-0 flex overflow-hidden">

  <!-- LHS: terminal, left blank on purpose -->
  <section class="w-1/2 h-full bg-neutral-900 border-r border-neutral-700"></section>

  <!-- RHS: one reply at a time. Up = older, Down = newer. -->
  <section id="pane" class="w-1/2 h-full overflow-hidden relative" style="background: var(--sepia-bg); color: var(--sepia-text)">
    <div id="counter" class="absolute top-3 right-4 text-sm opacity-60 z-10"></div>
    <!-- One layer per visible reply. During a slide there are two: the old one leaving, the new one arriving. -->
  </section>

  <script>
    // Data: replies, oldest first. Each reply is a list of blocks. Hand-written, no text repeats.
    const replies = [
      [
        { t: 'h1', s: '1. How lighthouses got their light' },
        { t: 'p', s: 'The first lighthouses were bonfires on hills. Sailors near Alexandria watched for a fire on the Pharos tower, and the flame was fed with wood carried up by hand. On a wet night the fire smoked more than it shone, and ships still struck the rocks.' },
        { t: 'p', s: 'Candles and oil lamps came next. They burned cleaner, but a bare flame throws light in every direction, and most of it goes into the sky. A keeper could polish the glass all night and the beam would still fade a few miles out.' },
        { t: 'h2', s: 'The Fresnel lens' },
        { t: 'p', s: 'In 1822 Augustin Fresnel cut a large lens into rings of prisms. Each ring bent stray light toward the horizon. The lens was thin enough to build at the size of a small room, and it gathered almost all of the lamp into one flat beam.' },
        { t: 'p', s: 'A single lamp behind a Fresnel lens could be seen twenty miles away. Rotating the lens gave each station its own pattern of flashes, so a captain could tell one coast from another by counting in the dark.' },
        { t: 'h2', s: 'After the keepers' },
        { t: 'p', s: 'Electric bulbs replaced the oil, and timers replaced the keepers. Today most lights run alone and are checked by boat a few times a year. Many old towers keep their glass lenses, though the ships that pass now steer by satellite.' },
      ],
      [
        { t: 'h1', s: '2. Starting a sourdough culture' },
        { t: 'p', s: 'A culture needs only flour, water and patience. Mix equal weights of whole wheat flour and lukewarm water in a jar, cover it loosely, and leave it somewhere warm.' },
        { t: 'ol', items: ['Day 1: mix fifty grams of each.', 'Day 2: little happens. Leave it alone.', 'Days 3 to 7: discard half, then feed fifty grams of each, once a day.', 'When it doubles within six hours of a feed, it is ready to bake with.'] },
        { t: 'p', s: 'The early bubbles on day two are often not yeast. They come from bacteria that die off as the jar turns sour. A quiet day three is normal, and many people throw the jar away right before it wakes up.' },
      ],
      [
        { t: 'h1', s: '3. Why the sea has tides' },
        { t: 'p', s: 'The moon pulls on the whole earth, but it pulls harder on the side that faces it. Water on that side heaps up a little toward the moon. On the far side, the earth itself is pulled away from the water, and a second bulge forms there.' },
        { t: 'p', s: 'The earth turns under these two bulges once a day. Most coasts pass through both of them, so they see two high tides and two low tides in about twenty-four hours and fifty minutes. The extra fifty minutes come from the moon moving along its orbit while the earth spins.' },
        { t: 'h2', s: 'Spring and neap' },
        { t: 'p', s: 'The sun raises tides too, at a little under half the moon’s strength. When sun and moon line up, at new moon and full moon, their bulges add, and the tides run high. These are spring tides, a name that has nothing to do with the season.' },
        { t: 'p', s: 'At the quarter moons the two pulls work at right angles. High water is lower and low water is higher. These gentle tides are called neap tides.' },
        { t: 'h2', s: 'Coastlines change the numbers' },
        { t: 'p', s: 'Out in the open ocean the bulge is less than a metre. Shape decides the rest. A funnel-shaped bay can squeeze the water into a rise of fifteen metres, as in the Bay of Fundy. An almost closed sea, like the Mediterranean, barely moves at all.' },
        { t: 'p', s: 'A few places get one tide a day instead of two, because the basin they sit in sloshes at its own rhythm and cancels one of the bulges. Tide tables are built from years of local measurement for exactly this reason.' },
      ],
      [
        { t: 'h1', s: '4. Keeping a fern alive indoors' },
        { t: 'p', s: 'Ferns grow on forest floors, in shade and damp air. A living room is bright and dry by comparison, which is why so many ferns turn brown at the tips within a month.' },
        { t: 'p', s: 'Put the pot near a north window or a few steps back from a sunny one. Keep the soil damp but never soaked, and check it with a finger every other day. A tray of wet pebbles under the pot raises the humidity around the leaves.' },
        { t: 'p', s: 'Cut brown fronds off at the base. They will not turn green again, and the plant puts its strength into new growth once they are gone.' },
      ],
      [
        { t: 'h1', s: '5. The opening moves of chess' },
        { t: 'p', s: 'Beginners are often told to memorise openings. Strong players say something simpler. Learn the ideas first, and the move orders follow.' },
        { t: 'h2', s: 'Three ideas' },
        { t: 'ul', items: ['Control the centre. Pawns and pieces on the middle squares reach more of the board.', 'Develop your pieces. Bring knights and bishops out before moving any piece twice.', 'Castle early. A king in the middle gets caught when the lines open.'] },
        { t: 'p', s: 'Most named openings are just these ideas in a fixed order. The Italian Game puts a bishop on a long diagonal aimed at the weak square next to the black king. The Queen’s Gambit offers a pawn to pull a black pawn away from the centre.' },
        { t: 'h2', s: 'A common trap' },
        { t: 'p', s: 'Bringing the queen out on move two looks strong. It attacks early and threatens a fast mate. Against a careful opponent, the queen gets chased by knights and pawns, and each retreat is a lost move.' },
        { t: 'pre', s: '1. e4 e5\n2. Qh5 Nc6\n3. Bc4 g6\n4. Qf3 Nf6' },
        { t: 'p', s: 'After the fourth move black has two pieces out and white has spent three moves on one piece. The attack is over, and black is ahead in development.' },
      ],
    ];

    const head = { color: 'var(--sepia-head)' };
    const code = { background: 'var(--sepia-code)', border: '1px solid var(--sepia-line)' };

    function el(tag, cls, text, style) {
      const e = document.createElement(tag);
      e.className = cls;
      if (text != null) e.textContent = text;
      Object.assign(e.style, style);
      return e;
    }

    function block(b) {
      switch (b.t) {
        case 'h1': return el('h1', 'text-2xl font-semibold mb-4', b.s, head);
        case 'h2': return el('h2', 'text-xl font-semibold mt-8 mb-3', b.s, head);
        case 'p': return el('p', 'mb-4', b.s);
        case 'pre': {
          const pre = el('pre', 'rounded px-4 py-3 mb-4 text-[15px] overflow-x-auto', null, code);
          pre.append(el('code', '', b.s));
          return pre;
        }
        case 'ul': {
          const ul = el('ul', 'list-disc pl-6 mb-4 space-y-1');
          b.items.forEach((s) => ul.append(el('li', '', s)));
          return ul;
        }
        case 'ol': {
          const ol = el('ol', 'list-decimal pl-6 mb-4 space-y-1');
          b.items.forEach((s) => ol.append(el('li', '', s)));
          return ol;
        }
      }
    }

    const pane = document.getElementById('pane');
    const counter = document.getElementById('counter');
    const SLIDE = 'transform 260ms ease-in-out';
    let index = replies.length - 1;
    let current = null; // the layer on screen

    // A layer is one full-size scrollable page holding one reply.
    function layer(i) {
      const l = el('div', 'absolute inset-0 overflow-y-auto');
      const article = el('article', 'max-w-prose mx-auto px-8 py-10 text-[17px] leading-7');
      article.append(...replies[i].map(block));
      l.append(article);
      return l;
    }

    // dir: -1 the older reply slides in from above, +1 the newer slides in from below, 0 no motion.
    function show(dir) {
      counter.textContent = `${index + 1} / ${replies.length}`;
      const next = layer(index);
      const prev = current;
      current = next;
      if (!dir) {
        if (prev) prev.remove();
        pane.append(next);
        return;
      }
      next.style.transform = `translateY(${dir * 100}%)`;
      pane.append(next);
      next.getBoundingClientRect(); // flush, so the next change animates
      next.style.transition = SLIDE;
      prev.style.transition = SLIDE;
      next.style.transform = 'translateY(0)';
      prev.style.transform = `translateY(${-dir * 100}%)`;
      prev.addEventListener('transitionend', () => prev.remove(), { once: true });
    }

    document.addEventListener('keydown', (e) => {
      const older = e.key === 'ArrowUp' || e.key === '{';
      const newer = e.key === 'ArrowDown' || e.key === '}';
      let dir;
      if (older && index > 0) { index -= 1; dir = -1; }
      else if (newer && index < replies.length - 1) { index += 1; dir = 1; }
      else return;
      e.preventDefault();
      show(dir);
    });

    show(0);
  </script>

</body>
</html>
