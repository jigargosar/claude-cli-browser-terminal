<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup: terminal fonts, one at a time</title>
<link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/atkinson-hyperlegible-mono/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/atkinson-hyperlegible-mono/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/atkinson-hyperlegible-mono/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/geist-mono/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/geist-mono/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/geist-mono/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-mono/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-mono/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/source-code-pro/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/source-code-pro/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/source-code-pro/600.css">
<style>
  html, body { margin: 0; height: 100%; background: #16181d; }
  body { display: flex; flex-direction: column; }
  #bar { padding: 8px 14px; font: 15px system-ui, sans-serif; color: #c9ced6; background: #0d0e11; }
  #bar b { color: #fff; }
  #bar span { color: #8a919c; margin-left: 16px; }
  #term { flex: 1; width: 50%; min-width: 600px; padding: 8px; }
</style>
</head>
<body>
<div id="bar"><b id="name"></b> <span id="info"></span><span>← → font · ↑ ↓ weight</span></div>
<div id="term"></div>
<script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
<script>
  // Real xterm with WebGL and the options of web/terminal.js, so the text renders as in the page.
  const fonts = ["Cascadia Mono", "Atkinson Hyperlegible Mono", "JetBrains Mono", "Geist Mono", "IBM Plex Mono", "Source Code Pro"];
  const weights = ["300", "400"];
  let f = 0;
  let w = 0;

  const term = new Terminal({
    cursorBlink: true,
    fontFamily: fonts[f],
    fontSize: 14,
    fontWeight: weights[w],
    fontWeightBold: "600",
    lineHeight: 1,
    theme: { background: "#16181d" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));
  term.loadAddon(new WebglAddon.WebglAddon());
  fit.fit();

  const B = "\x1b[1m", N = "\x1b[22m", BLUE = "\x1b[38;2;110;168;254m", DIM = "\x1b[38;2;138;145;156m", R = "\x1b[0m";
  const sample = [
    `${B}2. The two tasks we're working on together${N}`,
    "",
    "- Font task (the last task in the list):",
    "  - The goal is a thinner, better monospace font in the terminal.",
    `  - The next step is a mockup page, ${BLUE}docs/mockups/terminal-fonts.html${R}, that`,
    "    shows these five fonts in their light weights.",
    `  - You pick one by eye. I then set it in ${BLUE}web/terminal.js${R}.`,
    "- Release plan (the last dot):",
    `  - What I know: ${BLUE}pnpm release${R} already builds, tags and packs, and the`,
    "    last release is v0.1.6.",
    "",
    "0O 1lI| {}[]() => != === -> <= rn m",
    "",
    "TLDR: My font shortlist is Atkinson Hyperlegible Mono, JetBrains Mono, Geist",
    "Mono, IBM Plex Mono and Source Code Pro.",
    "",
    `${DIM}✻ Sautéed for 6s · done 6:00 PM${R}`,
    "",
    "> ",
  ].join("\r\n");
  term.write(sample);

  const show = () => {
    term.options.fontFamily = fonts[f];
    term.options.fontWeight = weights[w];
    fit.fit();
    document.getElementById("name").textContent = fonts[f];
    const loaded = document.fonts.check(`${weights[w]} 14px "${fonts[f]}"`);
    document.getElementById("info").textContent = `weight ${weights[w]}, bold 600${loaded ? "" : " · font NOT loaded, fallback shown"}`;
  };

  addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") f = (f + 1) % fonts.length;
    else if (e.key === "ArrowLeft") f = (f + fonts.length - 1) % fonts.length;
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") w = 1 - w;
    else return;
    e.preventDefault();
    show();
  });

  // Load every face first, so xterm measures the real font, not the fallback.
  Promise.all(fonts.flatMap((name) => [...weights, "600"].map((wt) => document.fonts.load(`${wt} 14px "${name}"`)))).then(show);
</script>
</body>
</html>
