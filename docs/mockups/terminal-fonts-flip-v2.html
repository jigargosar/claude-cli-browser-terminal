<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup: terminal fonts, one at a time (v2)</title>
<link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #16181d; }
  body { display: flex; flex-direction: column; }
  #bar { padding: 8px 14px; font: 15px system-ui, sans-serif; color: #c9ced6; background: #0d0e11; }
  #bar b { color: #fff; }
  #bar span { color: #8a919c; margin-left: 16px; }
  #term { flex: 1; width: 50%; min-width: 600px; padding: 8px; }
</style>
</head>
<body>
<div id="bar"><b id="name"></b> <span id="info"></span><span>← → font · ↑ ↓ weight · B bold · + − size</span></div>
<div id="term"></div>
<script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
<script src="terminal-fonts-v2.js"></script>
<script>
  let f = 0;
  let entry;

  const show = () => {
    const name = FONTS[f].name;
    entry.fontName = name;
    entry.term.options.fontFamily = `"${name}", monospace`;
    applyAll();
    document.getElementById("name").textContent = name;
    document.getElementById("info").textContent = settingsText() + (isLoaded(name) ? "" : " · font NOT loaded, fallback shown");
  };

  addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") f = (f + 1) % FONTS.length;
    else if (e.key === "ArrowLeft") f = (f + FONTS.length - 1) % FONTS.length;
    else if (!handleSettingKey(e)) return;
    e.preventDefault();
    show();
  });

  whenFontsLoaded().then(() => {
    entry = makeTerm(document.getElementById("term"), FONTS[f].name);
    show();
  });
</script>
</body>
</html>
