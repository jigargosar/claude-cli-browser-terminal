<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup: terminal fonts, side by side (v2)</title>
<link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
<style>
  body { margin: 0; padding: 12px; background: #0d0e11; color: #c9ced6; font: 14px system-ui, sans-serif; }
  #bar { margin-bottom: 10px; }
  #bar span { color: #8a919c; margin-left: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(640px, 1fr)); gap: 12px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 4px; color: #8a919c; }
  .term { height: 330px; padding: 6px; background: #16181d; }
</style>
</head>
<body>
<div id="bar"><b id="info"></b><span>↑ ↓ weight · B bold · + − size · the first card is today's font</span></div>
<div class="grid" id="grid"></div>
<script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
<script src="terminal-fonts-v2.js"></script>
<script>
  const captions = [];

  const show = () => {
    applyAll();
    document.getElementById("info").textContent = settingsText();
    terms.forEach(({ fontName }, i) => {
      captions[i].textContent = fontName + (isLoaded(fontName) ? "" : " · NOT loaded, fallback shown");
    });
  };

  addEventListener("keydown", (e) => {
    if (!handleSettingKey(e)) return;
    e.preventDefault();
    show();
  });

  whenFontsLoaded().then(() => {
    const grid = document.getElementById("grid");
    for (const { name } of FONTS) {
      const figure = document.createElement("figure");
      const caption = document.createElement("figcaption");
      const box = document.createElement("div");
      box.className = "term";
      figure.append(caption, box);
      grid.append(figure);
      captions.push(caption);
      makeTerm(box, name);
    }
    show();
  });
</script>
</body>
</html>
