<style>
  body { margin: 0; padding: 16px; background: #0d0e11; color: #c9ced6; font: 13px system-ui, sans-serif; }
  header { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 12px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 4px; color: #8a919c; }
  /* Same look as web/terminal.js: 14px, line height 1, white on #16181d. */
  pre { margin: 0; padding: 10px 12px; background: #16181d; color: #fff; font-size: 14px; line-height: 1.2; white-space: pre-wrap; }
  b { font-weight: 700; }
  .path { color: #6ea8fe; }
  .dim { color: #8a919c; }
  .prompt { color: #fff; }
</style>
</head>
<body>
<header>
  <strong>Terminal fonts</strong>
  <label>Weight
    <select id="weight">
      <option value="300" selected>300 light</option>
      <option value="400">400 normal</option>
    </select>
  </label>
  <span class="dim">Bold lines stay 700. The first card is today's font.</span>
</header>
<div class="grid" id="grid"></div>

<template id="sample">
<b>2. The two tasks we're working on together</b>

- Font task (the last task in the list):
  - The goal is a thinner, better monospace font.
  - The next step is a mockup page, <span class="path">docs/mockups/terminal-fonts.html</span>.
  - You pick one by eye. I set it in <span class="path">web/terminal.js</span>.

TLDR: Releases are tagged v0.1.1 to v0.1.6.

<span class="dim">✻ Sautéed for 6s · done 6:00 PM</span>
<span class="prompt">&gt; </span>▌</template>

<script>
  const fonts = [
    "Cascadia Mono",
    "Atkinson Hyperlegible Mono",
    "JetBrains Mono",
    "Geist Mono",
    "IBM Plex Mono",
    "Source Code Pro",
  ];
  const grid = document.getElementById("grid");
  const sample = document.getElementById("sample").innerHTML;
  for (const font of fonts) {
    grid.insertAdjacentHTML("beforeend", `<figure><figcaption>${font}</figcaption><pre style="font-family: '${font}', monospace">${sample}</pre></figure>`);
  }
  const weight = document.getElementById("weight");
  const apply = () => grid.querySelectorAll("pre").forEach((pre) => (pre.style.fontWeight = weight.value));
  weight.addEventListener("change", apply);
  apply();
</script>
</body>
</html>
