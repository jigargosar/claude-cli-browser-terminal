<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup R1: one reply at a time, up and down switch</title>
<link rel="stylesheet" href="../../web/base.css">
<link rel="stylesheet" href="../../web/reader.css">
<style>
  /* Only the right half: the reply pane fills the window. */
  body { background: var(--paper); }
  #reply-pane { min-width: 0; height: 100vh; overflow: hidden; }
  #reply { position: relative; overflow: hidden; padding: 0; }
  .page { position: absolute; inset: 0; overflow-y: auto; padding: 32px 48px 72px; box-sizing: border-box; }
  .page.enter-down { animation: from-below 260ms cubic-bezier(.2,.7,.2,1) both; }
  .page.enter-up { animation: from-above 260ms cubic-bezier(.2,.7,.2,1) both; }
  .page.leave-down { animation: to-above 260ms cubic-bezier(.2,.7,.2,1) both; }
  .page.leave-up { animation: to-below 260ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes from-below { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes from-above { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes to-above { from { transform: none; opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }
  @keyframes to-below { from { transform: none; opacity: 1; } to { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .page { animation: none !important; } }
  /* Where you are: n of N, bottom right, quiet. */
  #pos { position: absolute; right: 14px; bottom: 10px; font: 12px/1 var(--sans); color: var(--ink-muted); z-index: 1; }
  .reply-time { font: 12px/1.4 var(--sans); color: var(--ink-muted); margin: 0 0 0.8em; }
  .md pre { white-space: pre-wrap; }
</style>
</head>
<body>
<aside id="reply-pane" aria-label="Reply">
  <button type="button" id="settings-button" class="bar-button" aria-label="Settings">&#9881;</button>
  <article id="reply" class="md" tabindex="0"></article>
  <p id="pos"></p>
</aside>

<template id="replies">
  <section>
    <p class="reply-time">6:12 PM</p>
    <p>Inference: where the divider sits and what range it allows.</p>
    <h2>Position</h2>
    <ol><li>Default: terminal 65% of the width.</li><li>Saved per browser. Double-click resets.</li></ol>
    <h2>Range</h2>
    <ol><li>Drag: no clamp in code.</li><li>Arrow keys: 2% per step, 10 to 90.</li><li>CSS floors: terminal 600px, reply 380px.</li></ol>
    <p>TLDR: Terminal gets 65% by default; drag is unclamped, arrows stay within 10 to 90.</p>
  </section>
  <section>
    <p class="reply-time">6:31 PM</p>
    <p>Inference: why all three shift-enter attempts submitted.</p>
    <p>Found it. The interception leaked a second key.</p>
    <ol>
      <li>Where: the custom key handler fired on keydown, sent the bytes, and returned false for that event only.</li>
      <li>The leak: the browser fires keypress after keydown for Enter. The handler returned true for keypress, so xterm sent its own CR.</li>
      <li>Fix: return false for every event of shift-enter and send LF on keydown.</li>
    </ol>
    <pre><code>term.attachCustomKeyEventHandler((e) =&gt; {
  if (e.key === "Enter" &amp;&amp; e.shiftKey) {
    if (e.type === "keydown") cb("\n");
    return false;
  }
  return true;
});</code></pre>
    <p>TLDR: The handler let the keypress CR through; now both events are swallowed.</p>
  </section>
  <section>
    <p class="reply-time">6:44 PM</p>
    <p>Inference: confirm the split persists.</p>
    <p>Yes. Every drag saves the percent to localStorage under <code>cc-web.split</code>. On load the saved value wins over the default.</p>
    <p>TLDR: The split is saved per browser and restored on reload.</p>
  </section>
  <section>
    <p class="reply-time">7:02 PM</p>
    <p>Inference: review the global rules for structure and phrasing.</p>
    <h2>Contradictions</h2>
    <ol>
      <li>"Always confirm" versus today's lesson: doing without asking is fine, doing something different is not.</li>
      <li>"No talk about your own mistakes" versus direct questions that need exactly that.</li>
      <li>"Dependency count is not a cost" versus a test-only dependency called noise.</li>
      <li>"Take any action" is too broad. Reading a file is an action.</li>
    </ol>
    <h2>Negatives without a positive</h2>
    <ol>
      <li>Line 57 repeats line 56, which gives the exact form.</li>
      <li>Line 28 says both the ban and the positive.</li>
      <li>Line 25 names a mode the file never defines.</li>
    </ol>
    <h2>Undefined terms</h2>
    <ol>
      <li>"Failed attempt". I counted edits.</li>
      <li>"Long task". Give a signal.</li>
      <li>"Saving tokens is critical" has no action.</li>
      <li>"A log in the scratchpad". I used the wrong folder.</li>
    </ol>
    <h2>Structure</h2>
    <ol>
      <li>Paths is about shell commands. Move under Tools.</li>
      <li>Package Management and Errors are both code rules. One heading.</li>
      <li>Examples use two formats. Pick the two-line form.</li>
    </ol>
    <blockquote>Fix the first two groups first. They change behaviour. The rest is polish.</blockquote>
    <p>TLDR: Four rules contradict today, three negatives repeat a positive, four terms are undefined, and the sections can shrink to four.</p>
  </section>
  <section>
    <p class="reply-time">7:19 PM</p>
    <p>Inference: count the sentences in the last paragraph.</p>
    <p>Four. Your rules say numbered lists, not paragraphs, so it should have been a list.</p>
    <p>TLDR: Four sentences, and it should have been a list.</p>
  </section>
</template>

<script>
  const sections = [...document.getElementById("replies").content.children];
  const reply = document.getElementById("reply");
  const pos = document.getElementById("pos");
  let index = sections.length - 1; // start on the newest, like the real pane
  let busy = false;

  const page = (i) => {
    const el = document.createElement("div");
    el.className = "page";
    el.append(sections[i].cloneNode(true));
    return el;
  };
  const showPos = () => { pos.textContent = `${index + 1} of ${sections.length}`; };

  reply.append(page(index));
  showPos();

  // ArrowUp: older reply (slides in from above). ArrowDown: newer (slides in from below).
  document.addEventListener("keydown", (e) => {
    const dir = { ArrowUp: -1, ArrowDown: 1 }[e.key];
    if (!dir || busy) return;
    const next = index + dir;
    if (next < 0 || next >= sections.length) return;
    e.preventDefault();
    busy = true;
    const leaving = reply.querySelector(".page");
    const entering = page(next);
    leaving.classList.add(dir > 0 ? "leave-down" : "leave-up");
    entering.classList.add(dir > 0 ? "enter-down" : "enter-up");
    reply.append(entering);
    index = next;
    showPos();
    entering.addEventListener("animationend", () => {
      leaving.remove();
      entering.className = "page";
      busy = false;
    }, { once: true });
  });
  reply.focus();
</script>
</body>
</html>
